name: Phase 2 manifest parity GREEN

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase2-parity-green.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 2 review branch
        uses: actions/checkout@v4
        with:
          ref: implementation/sc900-reviewed-bank-phase2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch validator schema parity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/validate_sc900_phase2.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one match, found {text.count(old)} for: {old[:80]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '    errors: list[dict[str, Any]] = []\n    schema_version = normalize_text(manifest.get("schema_version"))\n',
              '''    errors: list[dict[str, Any]] = []
    manifest_fields = {"schema_version", "partition_epoch", "blueprint_version", "items"}
    item_fields = {
        "question_id", "semantic_family_id", "source_family_id", "role",
        "promotion_status", "future_probe_suitability", "family_state",
        "assignment_rationale", "assignment_receipt", "blueprint_version",
    }
    receipt_fields = {"override_type", "prior_family_ids", "reviewed_at", "reviewer"}
    promotion_statuses = {"approved", "pending", "withheld"}
    probe_suitabilities = {"eligible", "train_only", "needs_review"}
    family_states = {"resolved", "unknown", "disputed", "needs_review"}
    override_types = {"none", "family_merge", "family_split", "role_change"}

    for field in sorted(set(manifest) - manifest_fields):
        errors.append(_error(
            "UNEXPECTED_MANIFEST_FIELD",
            "manifest contains a field forbidden by the published schema",
            field=field,
        ))

    schema_version = normalize_text(manifest.get("schema_version"))
''')

          replace_once(
              '    raw_items = manifest.get("items")\n    items = list(raw_items) if isinstance(raw_items, list) else []\n',
              '''    if "items" not in manifest:
        errors.append(_error("MISSING_MANIFEST_ITEMS", "manifest items is required"))
        items: list[Any] = []
    else:
        raw_items = manifest.get("items")
        if not isinstance(raw_items, list):
            errors.append(_error("INVALID_MANIFEST_ITEMS_TYPE", "manifest items must be an array"))
            items = []
        else:
            items = raw_items
''')

          replace_once(
              '        if not isinstance(raw_item, Mapping):\n            errors.append(_error("MALFORMED_MANIFEST_ITEM", "manifest item must be an object", index=index))\n            continue\n\n        question_id = normalize_text(raw_item.get("question_id"))\n',
              '''        if not isinstance(raw_item, Mapping):
            errors.append(_error("MALFORMED_MANIFEST_ITEM", "manifest item must be an object", index=index))
            continue

        for field in sorted(set(raw_item) - item_fields):
            errors.append(_error(
                "UNEXPECTED_MANIFEST_ITEM_FIELD",
                "manifest item contains a field forbidden by the published schema",
                index=index,
                field=field,
            ))

        question_id = normalize_text(raw_item.get("question_id"))
''')

          replace_once(
              '        assignment_rationale = normalize_text(raw_item.get("assignment_rationale"))\n        assignment_receipt = raw_item.get("assignment_receipt")\n\n        if not question_id:\n',
              '''        assignment_rationale = normalize_text(raw_item.get("assignment_rationale"))
        assignment_receipt = raw_item.get("assignment_receipt")

        if promotion_status not in promotion_statuses:
            errors.append(_error(
                "INVALID_PROMOTION_STATUS",
                "promotion_status must be approved, pending, or withheld",
                question_id=question_id,
                promotion_status=promotion_status,
            ))
        if probe_suitability not in probe_suitabilities:
            errors.append(_error(
                "INVALID_PROBE_SUITABILITY",
                "future_probe_suitability must match the published schema enum",
                question_id=question_id,
                future_probe_suitability=probe_suitability,
            ))
        if family_state not in family_states:
            errors.append(_error(
                "INVALID_FAMILY_STATE",
                "family_state must match the published schema enum",
                question_id=question_id,
                family_state=family_state,
            ))

        if not question_id:
''')

          replace_once(
              '        if not isinstance(assignment_receipt, Mapping):\n            errors.append(_error("MISSING_ASSIGNMENT_RECEIPT", "assignment_receipt must be an object", question_id=question_id))\n        elif not normalize_text(assignment_receipt.get("reviewer")) or not normalize_text(assignment_receipt.get("reviewed_at")):\n            errors.append(_error("INCOMPLETE_ASSIGNMENT_RECEIPT", "assignment_receipt requires reviewer and reviewed_at", question_id=question_id))\n',
              '''        if not isinstance(assignment_receipt, Mapping):
            errors.append(_error("MISSING_ASSIGNMENT_RECEIPT", "assignment_receipt must be an object", question_id=question_id))
        else:
            for field in sorted(set(assignment_receipt) - receipt_fields):
                errors.append(_error(
                    "UNEXPECTED_ASSIGNMENT_RECEIPT_FIELD",
                    "assignment_receipt contains a field forbidden by the published schema",
                    question_id=question_id,
                    field=field,
                ))
            if not normalize_text(assignment_receipt.get("reviewer")) or not normalize_text(assignment_receipt.get("reviewed_at")):
                errors.append(_error("INCOMPLETE_ASSIGNMENT_RECEIPT", "assignment_receipt requires reviewer and reviewed_at", question_id=question_id))
            if "override_type" in assignment_receipt:
                override_type = normalize_text(assignment_receipt.get("override_type")).lower()
                if override_type not in override_types:
                    errors.append(_error(
                        "INVALID_ASSIGNMENT_OVERRIDE_TYPE",
                        "assignment_receipt override_type must match the published schema enum",
                        question_id=question_id,
                        override_type=override_type,
                    ))
            if "prior_family_ids" in assignment_receipt:
                prior_family_ids = assignment_receipt.get("prior_family_ids")
                valid_prior_ids = (
                    isinstance(prior_family_ids, list)
                    and all(isinstance(value, str) and bool(value) for value in prior_family_ids)
                    and len(prior_family_ids) == len(set(prior_family_ids))
                )
                if not valid_prior_ids:
                    errors.append(_error(
                        "INVALID_PRIOR_FAMILY_IDS",
                        "assignment_receipt prior_family_ids must be an array of unique non-empty strings",
                        question_id=question_id,
                    ))
''')

          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile tools/validate_sc900_phase2.py

      - name: Run parity and Phase 2 focused tests
        shell: bash
        run: |
          python -m unittest tests.test_sc900_phase2_deep_review tests.test_sc900_phase2 -v

      - name: Verify deterministic committed evidence is unchanged
        shell: bash
        run: |
          python -m tools.build_sc900_phase2 --verify-committed

      - name: Commit validator fix to Phase 2 branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/validate_sc900_phase2.py
          git diff --cached --quiet && { echo 'No validator change produced'; exit 1; }
          test "$(git diff --cached --name-only)" = 'tools/validate_sc900_phase2.py'
          git commit -m 'fix: enforce TRAIN PROBE manifest schema parity'
          git push origin HEAD:implementation/sc900-reviewed-bank-phase2

      - name: Self-remove GREEN workflow
        if: always()
        shell: bash
        run: |
          git reset --hard
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/phase2-parity-green.yml
          git commit -m 'chore: remove Phase 2 parity GREEN runner'
          git push origin HEAD:main
