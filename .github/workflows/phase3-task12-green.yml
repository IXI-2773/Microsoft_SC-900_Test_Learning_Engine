name: Phase 3 Task 1-2 GREEN verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase3-task12-green.yml'

permissions:
  contents: write

jobs:
  verify-task12:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact Phase 3 publication head
        uses: actions/checkout@v4
        with:
          ref: 8f194252dd18bc4aabbc7aa76da0a9da90fbcb61
          path: phase3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Phase 3 validator
        shell: bash
        run: |
          cd phase3
          python -m py_compile tools/validate_sc900_phase3.py tests/test_sc900_phase3.py

      - name: Run focused Phase 3 and predecessor regressions
        shell: bash
        run: |
          cd phase3
          python -m unittest \
            tests.test_sc900_phase3 \
            tests.test_sc900_phase2_deep_review \
            tests.test_sc900_phase2_receipt_portability \
            -v

      - name: Verify bounded publication scope
        shell: bash
        run: |
          cd phase3
          git diff --name-only a6784f92d0ffced42e92967930651226b5e27ff0..HEAD | tee /tmp/phase3-task12-files.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
              'tests/test_sc900_phase3.py',
              'tools/validate_sc900_phase3.py',
              'content/sc900/phase3/README.md',
              'content/sc900/phase3/source_inventory.json',
          }
          actual = {line.strip() for line in Path('/tmp/phase3-task12-files.txt').read_text().splitlines() if line.strip()}
          unexpected = actual - allowed
          missing = allowed - actual
          if unexpected or missing:
              raise SystemExit(f'unexpected={sorted(unexpected)} missing={sorted(missing)}')
          print('TASK12_SCOPE=BOUNDED')
          PY

      - name: Remove one-shot workflow and restore main content
        if: always()
        uses: actions/checkout@v4
        with:
          ref: main
          path: cleanup
          fetch-depth: 2

      - name: Self-clean main
        if: always()
        shell: bash
        run: |
          cd cleanup
          expected_parent='17ec4751dce790b8187f1b81f859e2b3ffae543e'
          actual_parent=$(git rev-parse HEAD^)
          if [ "$actual_parent" != "$expected_parent" ]; then
            echo "Unexpected main parent: $actual_parent"
            exit 1
          fi
          rm .github/workflows/phase3-task12-green.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/phase3-task12-green.yml
          git commit -m 'chore: remove Phase 3 Task 1-2 verification runner'
          git push origin HEAD:main
