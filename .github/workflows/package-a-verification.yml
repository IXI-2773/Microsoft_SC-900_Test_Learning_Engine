name: Verify Package A content-revision equivalence

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify-package-a:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'implementation/sc900-content-revision-equivalence-migration-A-001'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact clean source tree before tests
        shell: bash
        run: |
          set -euo pipefail
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "PR_HEAD_SHA=${{ github.event.pull_request.head.sha }}"
          echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
          if [ -n "${{ github.event.pull_request.head.sha }}" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          else
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          fi
          test -z "$(git status --porcelain=v1)"
          git diff --exit-code

      - name: Install verification tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install black ruff mypy -r requirements-extract.txt

      - name: Run Package A tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_content_revision_authority \
            tests.test_content_revision_migration \
            tests.test_content_revision_app_integration -q

      - name: Run identity and session regression wall
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_backlog1_progress_identity_migration \
            tests.test_backlog1_segment1_adversarial_review \
            tests.test_backlog1_segment2_session_identity \
            tests.test_backlog1_segment2_session_app_integration \
            tests.test_backlog1_segment3_adversarial_closure \
            tests.test_sc900_final_bank_activation_migration -q

      - name: Run full unittest discovery
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -q

      - name: Run quality checks
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.run_quality_checks

      - name: Run bank lint
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.lint_bank \
            --bank sc900_bank_v8_final.json \
            --allow-warnings

      - name: Run installation verification
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.verify_installation

      - name: Verify production immutability invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          from content_revision_registry import AUTHORIZED_CONTENT_REVISION_MANIFESTS

          expected_bank = "177a4fb5f8a874ffe4dda6b69e3d1c03dbdad1f5db5a174a990eb8b5a0e5927c"
          expected_exe = "9c5d6cdfa46e4b6a49dd5ff1760f1f1d1640b4e1e889009547b682ecd54f7558"
          bank = Path("sc900_bank_v8_final.json")
          exe = Path("SC900TestLearningEngine.exe")
          bank_sha = hashlib.sha256(bank.read_bytes()).hexdigest()
          exe_sha = hashlib.sha256(exe.read_bytes()).hexdigest()
          print(f"BANK {bank_sha}")
          print(f"EXE_PRESENT {exe.is_file()}")
          print(f"EXE {exe_sha}")
          print(f"AUTHORIZED_CONTENT_REVISION_MANIFESTS = {AUTHORIZED_CONTENT_REVISION_MANIFESTS}")
          assert bank_sha == expected_bank, bank_sha
          assert exe_sha == expected_exe, exe_sha
          assert AUTHORIZED_CONTENT_REVISION_MANIFESTS == {}, AUTHORIZED_CONTENT_REVISION_MANIFESTS
          PY

      - name: Verify exact clean source tree after all checks
        shell: bash
        run: |
          set -euo pipefail
          echo "FINAL_CHECKED_OUT_SHA=$(git rev-parse HEAD)"
          if [ -n "${{ github.event.pull_request.head.sha }}" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          else
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          fi
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"
