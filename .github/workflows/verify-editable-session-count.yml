name: Verify editable session count

on:
  push:
    branches:
      - fix/editable-session-count

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Focused session-count control test
        run: python -m unittest tests.test_session_count_control -v
      - name: Full regression suite
        run: python -m unittest discover -s tests -v
