name: SC-900 Phase 2 worker

on:
  push:
    branches:
      - implementation/sc900-reviewed-bank-phase2

permissions:
  contents: write

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Materialize one-shot Phase 2 content payload
        if: ${{ hashFiles('tools/_phase2_content_payload.py') != '' }}
        run: python tools/_phase2_content_payload.py

      - name: Rebalance Phase 2 answer positions
        run: |
          python - <<'PY'
          import copy
          import hashlib
          import json
          from collections import Counter
          from pathlib import Path

          batch_paths = sorted(Path('content/sc900/phase2/batches').glob('batch-*.jsonl'))
          batches = []
          questions = []
          for path in batch_paths:
              rows = [json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]
              if len(rows) != 10:
                  raise SystemExit(f'{path}: expected 10 questions, found {len(rows)}')
              batches.append((path, rows))
              questions.extend(rows)

          if len(questions) != 50:
              raise SystemExit(f'expected 50 Phase-2 questions, found {len(questions)}')

          ids = [row['id'] for row in questions]
          if len(ids) != len(set(ids)):
              raise SystemExit('Phase-2 question IDs are not unique')

          quotas = {'A': 12, 'B': 13, 'C': 12, 'D': 13}
          labels = tuple(quotas)

          def maximum_streak(sequence):
              best = current = 0
              previous = None
              for value in sequence:
                  current = current + 1 if value == previous else 1
                  previous = value
                  best = max(best, current)
              return best

          def assignment_for_salt(salt):
              ranked = sorted(
                  ids,
                  key=lambda question_id: hashlib.sha256(
                      f'sc900-phase2-answer-order-v1:{salt}:{question_id}'.encode('utf-8')
                  ).digest(),
              )
              result = {}
              offset = 0
              for label in labels:
                  for question_id in ranked[offset:offset + quotas[label]]:
                      result[question_id] = label
                  offset += quotas[label]
              return result

          assignment = None
          chosen_salt = None
          for salt in range(10000):
              candidate = assignment_for_salt(salt)
              sequence = [candidate[question_id] for question_id in ids]
              if maximum_streak(sequence) > 2:
                  continue
              batch_ok = True
              for start in range(0, 50, 10):
                  counts = Counter(sequence[start:start + 10])
                  if set(counts) != set(labels) or max(counts.values()) > 4:
                      batch_ok = False
                      break
              if batch_ok:
                  assignment = candidate
                  chosen_salt = salt
                  break

          if assignment is None:
              raise SystemExit('could not derive a bounded balanced answer-position assignment')

          position = {'A': 0, 'B': 1, 'C': 2, 'D': 3}
          global_index = 0
          for path, rows in batches:
              rewritten = []
              for row in rows:
                  before = copy.deepcopy(row)
                  raw_correct = row.get('correct_answer')
                  correct_ids = raw_correct if isinstance(raw_correct, list) else [raw_correct]
                  correct_ids = [str(value) for value in correct_ids if value not in (None, '')]
                  if len(correct_ids) != 1:
                      raise SystemExit(f"{row.get('id')}: answer-position rebalance requires one correct answer")
                  correct_id = correct_ids[0]
                  choices = list(row.get('choices') or [])
                  if len(choices) != 4:
                      raise SystemExit(f"{row.get('id')}: expected four choices")
                  matches = [choice for choice in choices if str(choice.get('id')) == correct_id]
                  if len(matches) != 1:
                      raise SystemExit(f"{row.get('id')}: could not resolve exactly one correct choice")
                  correct_choice = matches[0]
                  distractors = [choice for choice in choices if str(choice.get('id')) != correct_id]
                  target = assignment[row['id']]
                  reordered = distractors[:]
                  reordered.insert(position[target], correct_choice)
                  row['choices'] = reordered

                  before_without_choices = copy.deepcopy(before)
                  after_without_choices = copy.deepcopy(row)
                  before_without_choices.pop('choices', None)
                  after_without_choices.pop('choices', None)
                  if before_without_choices != after_without_choices:
                      raise SystemExit(f"{row.get('id')}: rebalance changed non-choice content")
                  before_map = {str(choice['id']): str(choice['text']) for choice in before['choices']}
                  after_map = {str(choice['id']): str(choice['text']) for choice in row['choices']}
                  if before_map != after_map:
                      raise SystemExit(f"{row.get('id')}: rebalance changed choice identity or text")
                  rewritten.append(row)
                  global_index += 1

              path.write_text(
                  ''.join(json.dumps(row, ensure_ascii=False, separators=(',', ':')) + '\n' for row in rewritten),
                  encoding='utf-8',
              )

          resulting = []
          for _, rows in batches:
              for row in rows:
                  correct = row['correct_answer'][0] if isinstance(row['correct_answer'], list) else row['correct_answer']
                  index = next(i for i, choice in enumerate(row['choices']) if str(choice['id']) == str(correct))
                  resulting.append(labels[index])
          counts = Counter(resulting)
          if counts != Counter(quotas):
              raise SystemExit(f'answer-position quota mismatch after rewrite: {dict(counts)}')
          if maximum_streak(resulting) > 2:
              raise SystemExit(f'answer-position streak exceeds 2: {maximum_streak(resulting)}')

          print('Phase-2 answer-position salt:', chosen_salt)
          print('Phase-2 answer-position counts:', dict(counts))
          print('Phase-2 maximum answer-position streak:', maximum_streak(resulting))
          PY

      - name: Audit authored Phase 2 increment
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          from ingestion.bank_quality import validate_phase1_question
          from ingestion.models import load_taxonomy
          from tools.validate_sc900_phase1 import REVIEW_CHECK_FIELDS, validate_source_inventory

          taxonomy = load_taxonomy()
          batch_dir = Path('content/sc900/phase2/batches')
          review_dir = Path('content/sc900/phase2/reviews')
          questions = []
          for path in sorted(batch_dir.glob('batch-*.jsonl')):
              rows = [json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]
              if len(rows) != 10:
                  raise SystemExit(f'{path}: expected 10 questions, found {len(rows)}')
              questions.extend(rows)

          if len(questions) != 50:
              raise SystemExit(f'expected 50 Phase-2 questions, found {len(questions)}')
          ids = [row['id'] for row in questions]
          if len(set(ids)) != 50:
              raise SystemExit('Phase-2 question IDs are not unique')

          expected_domains = {
              'security_compliance_identity': 6,
              'microsoft_entra': 14,
              'microsoft_security_solutions': 19,
              'microsoft_compliance_solutions': 11,
          }
          expected_objectives = {
              'security_compliance_concepts': 3,
              'identity_concepts': 3,
              'entra_identity_types_and_function': 3,
              'entra_authentication': 4,
              'entra_access_management': 3,
              'entra_identity_protection_governance': 4,
              'azure_infrastructure_security': 6,
              'azure_security_management': 4,
              'microsoft_sentinel': 3,
              'defender_xdr': 6,
              'service_trust_privacy': 2,
              'purview_compliance_management': 2,
              'purview_information_protection_lifecycle': 4,
              'purview_insider_risk_ediscovery_audit': 3,
          }
          domains = dict(Counter(row['domain'] for row in questions))
          objectives = dict(Counter(row['objective'] for row in questions))
          if domains != expected_domains:
              raise SystemExit(f'domain allocation mismatch: {domains}')
          if objectives != expected_objectives:
              raise SystemExit(f'objective allocation mismatch: {objectives}')

          for row in questions:
              validate_phase1_question(row, taxonomy)

          inventory = json.loads(Path('content/sc900/phase2/source_inventory.json').read_text(encoding='utf-8'))
          source_errors = validate_source_inventory(inventory, taxonomy)
          if source_errors:
              raise SystemExit(f'Phase-2 source inventory errors: {source_errors}')

          reviews = []
          for path in sorted(review_dir.glob('batch-*-review.json')):
              payload = json.loads(path.read_text(encoding='utf-8'))
              rows = payload.get('reviews', [])
              if len(rows) != 10:
                  raise SystemExit(f'{path}: expected 10 reviews, found {len(rows)}')
              reviews.extend(rows)
          if len(reviews) != 50:
              raise SystemExit(f'expected 50 Phase-2 reviews, found {len(reviews)}')
          review_ids = {row['question_id'] for row in reviews}
          if review_ids != set(ids):
              raise SystemExit('Phase-2 review IDs do not exactly match question IDs')
          for receipt in reviews:
              if receipt.get('disposition') != 'approved':
                  raise SystemExit(f"{receipt.get('question_id')}: non-approved review receipt")
              missing = [field for field in REVIEW_CHECK_FIELDS if receipt.get(field) is not True]
              if missing:
                  raise SystemExit(f"{receipt.get('question_id')}: incomplete review checks {missing}")
              if not receipt.get('reviewer') or not receipt.get('reviewed_at'):
                  raise SystemExit(f"{receipt.get('question_id')}: incomplete review custody")

          print('Phase-2 authored increment audit: 50 questions / 50 approved review receipts')
          print('Domain allocation:', domains)
          print('Objective allocation:', objectives)
          print('Source inventory: valid')
          PY

      - name: Build cumulative Phase 2 canonical and compiled artifacts
        if: ${{ hashFiles('content/sc900/phase2/phase2_acceptance_report.json') == '' }}
        run: |
          set -euo pipefail
          rm -rf content/sc900/phase2/store content/sc900/phase2/compiled
          cp -R content/sc900/phase1/store content/sc900/phase2/store

          for batch in content/sc900/phase2/batches/batch-*.jsonl; do
            python tools/import_sc900_content.py "$batch" --store content/sc900/phase2/store
          done

          python - <<'PY'
          import json
          from pathlib import Path
          from ingestion.importer import apply_review_decision, compile_question_bank, promotion_counts

          store = Path('content/sc900/phase2/store')
          receipts = []
          for path in sorted(Path('content/sc900/phase2/reviews').glob('batch-*-review.json')):
              receipts.extend(json.loads(path.read_text(encoding='utf-8'))['reviews'])

          questions = json.loads((store / 'questions.json').read_text(encoding='utf-8'))
          before = promotion_counts(questions)
          if before != {'approved': 50, 'pending': 50, 'withheld': 0}:
              raise SystemExit(f'import did not preserve IMPORT != APPROVAL: {before}')

          decisions_before = json.loads((store / 'review_decisions.json').read_text(encoding='utf-8'))
          for receipt in receipts:
              qid = receipt['question_id']
              pending = [row for row in decisions_before if row.get('id') == qid and row.get('decision') == 'pending' and row.get('actor') == 'import']
              if not pending:
                  raise SystemExit(f'{qid}: missing import-pending decision before approval')
              apply_review_decision(store, qid, 'approved', actor=receipt['reviewer'])

          questions = json.loads((store / 'questions.json').read_text(encoding='utf-8'))
          after = promotion_counts(questions)
          if after != {'approved': 100, 'pending': 0, 'withheld': 0}:
              raise SystemExit(f'approval gate did not reach 100/0/0: {after}')

          output = Path('content/sc900/phase2/compiled/sc900_phase2_reviewed_bank.json')
          report = compile_question_bank(store, output)
          if report['compiled'] != 100:
              raise SystemExit(f"expected compiled=100, got {report['compiled']}")
          print('Cumulative promotion counts:', after)
          print('Compiled count:', report['compiled'])
          PY

          python tools/validate_sc900_phase2.py \
            --store content/sc900/phase2/store \
            --compiled content/sc900/phase2/compiled/sc900_phase2_reviewed_bank.json \
            --phase1-reviews content/sc900/phase1/reviews \
            --phase2-reviews content/sc900/phase2/reviews \
            --phase2-batches content/sc900/phase2/batches \
            --source-inventory content/sc900/phase2/source_inventory.json \
            --report content/sc900/phase2/phase2_acceptance_report.json

          python - <<'PY'
          import hashlib
          from pathlib import Path
          from ingestion.importer import compile_question_bank

          store = Path('content/sc900/phase2/store')
          compiled = Path('content/sc900/phase2/compiled/sc900_phase2_reviewed_bank.json')
          first = hashlib.sha256(compiled.read_bytes()).hexdigest()
          probe = Path('/tmp/sc900_phase2_reviewed_bank.recompiled.json')
          compile_question_bank(store, probe)
          second = hashlib.sha256(probe.read_bytes()).hexdigest()
          if first != second or compiled.read_bytes() != probe.read_bytes():
              raise SystemExit(f'non-deterministic compile: {first} != {second}')
          print('Deterministic compiled SHA-256:', first)
          PY

      - name: Run Phase 2 and inherited bank-contract tests
        run: |
          python -m unittest \
            tests.test_sc900_phase2 \
            tests.test_sc900_bank_quality \
            tests.test_sc900_taxonomy \
            tests.test_ingestion_importer \
            -v

      - name: Commit balanced Phase 2 bank and generated artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/sc900/phase2/batches content/sc900/phase2/store content/sc900/phase2/compiled content/sc900/phase2/phase2_acceptance_report.json
          if ! git diff --cached --quiet; then
            git commit -m "fix: rebalance and compile SC-900 Phase 2 reviewed bank"
            git push origin HEAD:implementation/sc900-reviewed-bank-phase2
          fi

      - name: Commit materialized Phase 2 content and remove payload
        if: ${{ hashFiles('tools/_phase2_content_payload.py') != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/sc900/phase2/batches content/sc900/phase2/reviews
          git rm tools/_phase2_content_payload.py
          git commit -m "content: add SC-900 Phase 2 reviewed question increment"
          git push origin HEAD:implementation/sc900-reviewed-bank-phase2
