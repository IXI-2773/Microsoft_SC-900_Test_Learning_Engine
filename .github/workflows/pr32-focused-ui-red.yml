name: PR32 focused UI regression

on:
  push:
    branches:
      - fix/sc900-answer-d-confidence-ui-001

permissions:
  contents: read

jobs:
  focused-ui-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run focused confidence-control regression
        run: python -m unittest tests.test_ui_confidence_controls -v
