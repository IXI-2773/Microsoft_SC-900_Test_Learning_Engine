name: Temporary answer-length tranche verification

on:
  push:
    branches:
      - implementation/sc900-answer-length-leakage-tranche1-001

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run answer-length audit and guard tests
        run: |
          python -m unittest tests.test_answer_length_audit -v
          python -m unittest tests.test_bank_revision_guard -v
      - name: Run learner-history compatibility gate
        run: |
          python -m unittest tests.test_answer_length_history_compatibility -v
      - name: Re-run existing identity and activation regressions
        run: |
          python -m unittest \
            tests.test_backlog1_progress_identity_migration \
            tests.test_backlog1_segment3_adversarial_closure \
            tests.test_sc900_final_bank_activation_migration \
            -v
      - name: Verify production bank remains unchanged and valid
        run: |
          python -m tools.lint_bank
          python -m tools.verify_installation
          sha256sum sc900_bank_v8_final.json
