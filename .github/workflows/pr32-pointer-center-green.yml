name: PR32 pointer-center GREEN refinement

on:
  push:
    branches:
      - fix/sc900-answer-d-confidence-ui-001

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRE_RUN_HEAD: e9f80ffd6a7f5cb6e2b6ac86989d93db943fbb3b
      CLEAN_FUNCTIONAL_HEAD: 6d6078a9a879707df2bba617ba94cb087cff8499
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sc900-answer-d-confidence-ui-001
          fetch-depth: 0
      - name: Verify bounded starting state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PRE_RUN_HEAD"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/pr32-pointer-center-green.yml"
          test -f .github/workflows/pr32-pointer-center-red.yml
      - name: Install Tk runtime for UI tests
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
      - name: Update regression expectation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_ui_confidence_controls.py')
          text = path.read_text(encoding='utf-8')
          old = """        self.assertGreaterEqual(x, 250)\n        self.assertLessEqual(x, 300)\n        self.assertGreaterEqual(y, 410)\n        self.assertLessEqual(y, 450)\n"""
          new = """        pointer_x_in_host = app.root.pointer_x - app.content_frame.x\n        self.assertEqual(pointer_x_in_host, x + prompt.requested_width // 2)\n        self.assertGreaterEqual(y, 410)\n        self.assertLessEqual(y, 450)\n"""
          if text.count(old) != 1:
              raise SystemExit('expected pointer assertion block not found exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Apply minimal centered-pointer placement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('app_question_flow_mixin.py')
          text = path.read_text(encoding='utf-8')
          old = """                    pointer_candidates = [\n                        (pointer_x + 12, pointer_y + 12),\n                        (pointer_x - pop_w - 12, pointer_y + 12),\n                        (pointer_x + 12, pointer_y - pop_h - 12),\n                        (pointer_x - pop_w - 12, pointer_y - pop_h - 12),\n                    ]\n"""
          new = """                    centered_x = pointer_x - int(pop_w / 2)\n                    pointer_candidates = [\n                        (centered_x, pointer_y + 12),\n                        (centered_x, pointer_y - pop_h - 12),\n                        (pointer_x + 12, pointer_y + 12),\n                        (pointer_x - pop_w - 12, pointer_y + 12),\n                        (pointer_x + 12, pointer_y - pop_h - 12),\n                        (pointer_x - pop_w - 12, pointer_y - pop_h - 12),\n                    ]\n"""
          if text.count(old) != 1:
              raise SystemExit('expected pointer candidate block not found exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: GREEN - focused confidence regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_ui_confidence_controls -v
      - name: Remove temporary workflows and verify clean functional diff
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr32-pointer-center-red.yml .github/workflows/pr32-pointer-center-green.yml
          changed="$(git diff --name-only "$CLEAN_FUNCTIONAL_HEAD" | sort)"
          expected="$(printf '%s\n' app_question_flow_mixin.py tests/test_ui_confidence_controls.py | sort)"
          test "$changed" = "$expected"
      - name: Commit and push refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: center confidence prompt under pointer'
          git push origin HEAD:fix/sc900-answer-d-confidence-ui-001
