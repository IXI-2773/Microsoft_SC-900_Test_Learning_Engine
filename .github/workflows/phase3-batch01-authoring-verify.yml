name: Phase 3 batch 01 authoring verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase3-batch01-authoring-verify.yml'

permissions:
  contents: write

jobs:
  verify-authoring:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact authored batch head
        uses: actions/checkout@v4
        with:
          ref: 1caec0652c9911e2b5f8a73bbc784c0622d8b812
          fetch-depth: 0
          path: phase3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate batch 01 before review
        shell: bash
        run: |
          cd phase3
          python - <<'PY'
          import json
          from pathlib import Path
          from ingestion.bank_quality import validate_phase1_question
          from ingestion.models import load_taxonomy
          from tools.validate_sc900_phase2 import validate_question_source_links

          taxonomy = load_taxonomy()
          batch_path = Path('content/sc900/phase3/batches/batch-01.jsonl')
          rows = [json.loads(line) for line in batch_path.read_text(encoding='utf-8').splitlines() if line.strip()]
          allocation = json.loads(Path('content/sc900/phase3/authoring_allocation.json').read_text(encoding='utf-8'))
          expected = [row for row in allocation['items'] if row['batch'] == 'batch-01']
          inventory = json.loads(Path('content/sc900/phase3/source_inventory.json').read_text(encoding='utf-8'))

          if len(rows) != 10 or len(expected) != 10:
              raise SystemExit(f'bad batch size rows={len(rows)} allocation={len(expected)}')
          if [row['id'] for row in rows] != [row['question_id'] for row in expected]:
              raise SystemExit('question IDs do not match frozen allocation')
          if len({row['id'] for row in rows}) != 10:
              raise SystemExit('duplicate IDs in batch')

          position_names = ['A', 'B', 'C', 'D']
          for question, slot in zip(rows, expected):
              validate_phase1_question(question, taxonomy)
              metadata = question['metadata']
              for qfield, sfield in (
                  ('domain','domain'), ('objective','objective')
              ):
                  if question[qfield] != slot[sfield]:
                      raise SystemExit(f"{question['id']} {qfield} drift")
              if metadata['blueprint_leaf_id'] != slot['blueprint_leaf_id']:
                  raise SystemExit(f"{question['id']} leaf drift")
              if metadata['source_family_id'] != slot['source_family_id']:
                  raise SystemExit(f"{question['id']} source family drift")
              if question['source']['url'] != slot['source_url']:
                  raise SystemExit(f"{question['id']} source URL drift")
              correct_id = question['correct_answer']
              displayed = next(index for index, choice in enumerate(question['choices']) if choice['id'] == correct_id)
              if position_names[displayed] != slot['display_correct_position_target']:
                  raise SystemExit(f"{question['id']} answer-position drift")
              if 'promotion_status' in question:
                  raise SystemExit(f"{question['id']} authored question must not be pre-approved")

          source_errors = validate_question_source_links(rows, inventory)
          if source_errors:
              raise SystemExit(source_errors)
          print('BATCH01_AUTHORED_COUNT=10')
          print('BATCH01_QUALITY_ERRORS=0')
          print('BATCH01_SOURCE_ERRORS=0')
          print('BATCH01_ALLOCATION_DRIFT=0')
          PY

      - name: Verify authoring/review separation
        shell: bash
        run: |
          cd phase3
          test ! -e content/sc900/phase3/reviews/batch-01-review.json
          echo 'BATCH01_REVIEW_NOT_YET_MATERIALIZED=YES'

      - name: Remove one-shot workflow
        if: always()
        uses: actions/checkout@v4
        with:
          ref: main
          path: cleanup
          fetch-depth: 2

      - name: Self-clean main
        if: always()
        shell: bash
        run: |
          cd cleanup
          expected_parent='0cf48d576bafa5d0b745950a7b1dd5801bc86971'
          actual_parent=$(git rev-parse HEAD^)
          if [ "$actual_parent" != "$expected_parent" ]; then
            echo "Unexpected main parent: $actual_parent"
            exit 1
          fi
          rm .github/workflows/phase3-batch01-authoring-verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/phase3-batch01-authoring-verify.yml
          git commit -m 'chore: remove Phase 3 batch 01 authoring runner'
          git push origin HEAD:main
