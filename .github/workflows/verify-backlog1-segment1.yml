name: Verify BACKLOG-1 Segment 1

on:
  push:
    branches:
      - implementation/sc900-backlog1-identity-migration

permissions:
  contents: write

jobs:
  verify-backlog1-segment1:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install verification tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install black ruff mypy pyinstaller -r requirements-extract.txt

      - name: Apply bounded review repair package when staged
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tools/backlog1_apply_review_fixes.py ]; then
            python tools/backlog1_apply_review_fixes.py
            rm tools/backlog1_apply_review_fixes.py
          fi

      - name: Run focused Segment-1 tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_backlog1_progress_identity_migration

      - name: Run affected and full regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v

      - name: Run quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check .
          python -m black --check --exclude 'SC-900-FREE-STUDY-GUIDE\.md|SC-900-Free-Study-Guide\.md|SC-900 Study Guide\.md' .
          python -m mypy --ignore-missing-imports --follow-imports=skip --check-untyped-defs --exclude '^tools/scrape_markdown_bank\.py$' --exclude '^tools/recover_free_study_guide\.py$' --exclude '^tools/build_free_study_guide\.py$' --exclude '^tools/build_reviewed_bank\.py$' --exclude '^tests/' --exclude '^implementation/' --exclude '^reference/' --exclude '^public_sources/' --exclude '^user_data/' --exclude '^build/' --exclude '^dist/' $(git ls-files '*.py')

      - name: Verify frozen scope and commit repaired tree
        shell: bash
        env:
          TARGET_BRANCH: implementation/sc900-backlog1-identity-migration
        run: |
          set -euo pipefail
          git diff -- cand01r3_partition.py cand01r3_runtime.py content/sc900/phase3 || true
          test -z "$(git status --porcelain -- cand01r3_partition.py cand01r3_runtime.py content/sc900/phase3)"
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name 'BACKLOG-1 verification bot'
            git config user.email 'actions@users.noreply.github.com'
            git add -A
            git commit -m 'fix: close segment-1 adversarial review gaps'
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
