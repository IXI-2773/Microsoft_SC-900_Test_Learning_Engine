name: Verify CAND-01R3 measurement integrity

on:
  push:
    branches:
      - research/sc900-cand01r3-measurement-001

permissions:
  contents: write

jobs:
  r2-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Strengthen RED tests before production repair
        run: |
          python tools/strengthen_cand01r3_r2_tests.py
          if ! git diff --quiet -- tests/test_cand01r3_measurement_integrity.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/test_cand01r3_measurement_integrity.py
            git commit -m "test: strengthen R2 navigation and calendar RED cases"
            git push origin HEAD:research/sc900-cand01r3-measurement-001
          fi

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-extract.txt

      - name: Record revision
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
          git status --short
          git diff --exit-code

      - name: Run R2 measurement-integrity tests
        run: python -m unittest discover -s tests -p 'test_cand01r3_measurement_integrity.py' -v
