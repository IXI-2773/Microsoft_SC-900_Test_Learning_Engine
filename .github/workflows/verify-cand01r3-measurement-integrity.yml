name: Verify CAND-01R3 measurement integrity

on:
  push:
    branches:
      - research/sc900-cand01r3-measurement-001

permissions:
  contents: write

jobs:
  r2-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Keep strengthened R2 tests canonical
        run: |
          python tools/strengthen_cand01r3_r2_tests.py
          if ! git diff --quiet -- tests/test_cand01r3_measurement_integrity.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/test_cand01r3_measurement_integrity.py
            git commit -m "test: add frozen answer-key authority regression"
            git push origin HEAD:research/sc900-cand01r3-measurement-001
          fi

      - name: Apply bounded measurement-integrity repair
        run: |
          python tools/prepare_cand01r3_integrity_repair.py
          python tools/apply_cand01r3_measurement_integrity_repair.py
          python tools/apply_cand01r3_answer_key_repair.py
          if ! git diff --quiet -- cand01r3_measurement.py cand01r3_protocol.py cand01r3_runtime.py app_question_flow_mixin.py app_question_render_mixin.py app_session_persistence_mixin.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cand01r3_measurement.py cand01r3_protocol.py cand01r3_runtime.py app_question_flow_mixin.py app_question_render_mixin.py app_session_persistence_mixin.py
            git commit -m "fix: enforce frozen CAND-01R3 answer-key authority"
            git push origin HEAD:research/sc900-cand01r3-measurement-001
          fi
          git checkout -- tools/apply_cand01r3_measurement_integrity_repair.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-extract.txt

      - name: Record revision
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
          git status --short
          git diff --exit-code

      - name: Run R2 measurement-integrity tests
        run: python -m unittest discover -s tests -p 'test_cand01r3_measurement_integrity.py' -v

      - name: Adversarial source inventory
        run: |
          echo '=== measurement scoring/recording callers ==='
          grep -RInE 'record_measurement_event\(|record_measurement_probe_answer\(|notify_scored_attempt\(' --include='*.py' . || true
          echo '=== measurement transition callers ==='
          grep -RInE 'begin_todays_probe_measurement\(' --include='*.py' . || true
          echo '=== reveal / redo / auto-next / export / restore surfaces ==='
          grep -RInE 'redo_question|maybe_auto_next_after_answer|format_choice_explanations|serialize_answer_state|restore_experimental_session|sanitize_learner_export|exam_reveal|choice_explan' --include='*.py' . || true
          echo '=== direct correctness/history mutation sites ==='
          grep -RInE 'update_progress_for_answer|session_answer_history|progress_data.*history|\["correct"\]|\.get\("correct"\)' --include='*.py' app*.py cand01r3_*.py session_*.py || true
