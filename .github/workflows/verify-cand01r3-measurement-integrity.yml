name: Verify CAND-01R3 measurement integrity

on:
  push:
    branches:
      - research/sc900-cand01r3-measurement-001

permissions:
  contents: read

jobs:
  r2-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-extract.txt

      - name: Record revision
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
          git status --short
          git diff --exit-code

      - name: Run R2 measurement-integrity tests
        run: python -m unittest discover -s tests -p 'test_cand01r3_measurement_integrity.py' -v
