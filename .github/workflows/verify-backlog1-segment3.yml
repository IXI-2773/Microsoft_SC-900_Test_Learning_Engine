name: Verify BACKLOG-1 Segment 3 (read-only)

on:
  push:
    branches:
      - implementation/sc900-backlog1-adversarial-closure
  pull_request:
    branches:
      - implementation/sc900-backlog1-adversarial-closure

permissions:
  contents: read

jobs:
  verify-backlog1-segment3:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact clean source tree before tests
        shell: bash
        run: |
          set -euo pipefail
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"
          git diff --exit-code

      - name: Install verification tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install black ruff mypy -r requirements-extract.txt

      - name: Run focused Segment-3 tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_backlog1_segment3_adversarial_closure

      - name: Run focused Segment-1 and Segment-2 identity regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_backlog1_progress_identity_migration \
            tests.test_backlog1_segment1_adversarial_review \
            tests.test_backlog1_segment2_session_identity \
            tests.test_backlog1_segment2_session_app_integration

      - name: Run full regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v

      - name: Run repository quality convention
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.run_quality_checks

      - name: Run bank and installation gates
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.lint_bank
          python -m tools.verify_installation

      - name: Verify frozen CAND scope untouched
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only 909fca8a70232639bab0ad6ef458f1733816a1ec -- cand01r3_partition.py cand01r3_runtime.py content/sc900/phase3)"

      - name: Verify exact clean source tree after all checks
        shell: bash
        run: |
          set -euo pipefail
          echo "FINAL_CHECKED_OUT_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"
