name: Apply PR32 pointer fix

on:
  push:
    branches: [fix/sc900-answer-d-confidence-ui-001]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch source
        shell: bash
        env:
          METHOD_B64: ""
        run: |
          python -c 'import base64, os; from pathlib import Path; p=Path("app_question_flow_mixin.py"); s=p.read_text(); a=s.index("    def _position_feedback_popover"); b=s.index("    def _confidence_controls_enabled", a); n=base64.b64decode(os.environ["METHOD_B64"]).decode(); p.write_text(s[:a]+n+s[b:])'
      - name: Test
        run: python -m unittest tests.test_ui_confidence_controls -v
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app_question_flow_mixin.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: place confidence prompt near active pointer"
          git push origin HEAD:fix/sc900-answer-d-confidence-ui-001
