name: Phase 2 manifest parity RED

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase2-parity-red.yml

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 2 review branch
        uses: actions/checkout@v4
        with:
          ref: implementation/sc900-reviewed-bank-phase2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run new parity regressions and require RED
        shell: bash
        run: |
          set +e
          python -m unittest \
            tests.test_sc900_phase2_deep_review.Phase2DeepReviewRegressionTests.test_manifest_rejects_missing_or_non_array_items \
            tests.test_sc900_phase2_deep_review.Phase2DeepReviewRegressionTests.test_unassigned_item_rejects_invalid_schema_enums \
            tests.test_sc900_phase2_deep_review.Phase2DeepReviewRegressionTests.test_manifest_rejects_schema_forbidden_extra_fields_and_bad_receipt_fields \
            -v 2>&1 | tee /tmp/parity-red.log
          rc=${PIPESTATUS[0]}
          set -e
          cat /tmp/parity-red.log
          if [ "$rc" -eq 0 ]; then
            echo 'Expected RED but all new parity tests passed before validator fix.'
            exit 1
          fi
          echo 'RED_CONFIRMED=1'

      - name: Self-remove diagnostic workflow
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/phase2-parity-red.yml
          git commit -m 'chore: remove Phase 2 parity RED runner'
          git push origin HEAD:main
