name: Prepare verified SC-900 EXE

on:
  push:
    branches: [release/sc900-exe-001]
    paths:
      - .github/workflows/publish-verified-exe-once.yml

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '34775901108'
      ARTIFACT_NAME: SC900TestLearningEngine-consolidated-main
      EXPECTED_EXE_SHA256: 7155577732d488711092c9145fff93895b1ae206391112c06cc41e135cbbd399
    steps:
      - name: Download verified artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sc900-release
          mkdir -p /tmp/sc900-release
          gh run download "$SOURCE_RUN" -R "$GITHUB_REPOSITORY" -n "$ARTIFACT_NAME" -D /tmp/sc900-release
          mapfile -t exes < <(find /tmp/sc900-release -type f -name 'SC900TestLearningEngine.exe')
          test "${#exes[@]}" -eq 1
          echo "$EXPECTED_EXE_SHA256  ${exes[0]}" | sha256sum -c -
          cp "${exes[0]}" /tmp/SC900TestLearningEngine.exe

      - name: Publish executable to release branch
        shell: bash
        run: |
          set -euo pipefail
          encoded="$(base64 -w0 /tmp/SC900TestLearningEngine.exe)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/SC900TestLearningEngine.exe" \
            -f message='release: add verified SC-900 Windows executable' \
            -f content="$encoded" \
            -f branch='release/sc900-exe-001'
