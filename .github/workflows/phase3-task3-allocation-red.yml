name: Phase 3 Task 3 allocation RED contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase3-task3-allocation-red.yml'

permissions:
  contents: write

jobs:
  red-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out allocation-test commit
        uses: actions/checkout@v4
        with:
          ref: c30558d02755f06ac3032ebe70cb7fa9c70ed2c6
          path: phase3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require expected missing-allocation RED failure
        shell: bash
        run: |
          cd phase3
          set +e
          python -m unittest tests.test_sc900_phase3_authoring_allocation -v 2>&1 | tee /tmp/phase3-allocation-red.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'ERROR: allocation tests unexpectedly passed before allocation existed.'
            exit 1
          fi
          grep -q 'missing frozen Task-3 allocation' /tmp/phase3-allocation-red.log
          echo 'EXPECTED_ALLOCATION_RED_CONFIRMED=YES'

      - name: Remove one-shot workflow
        if: always()
        uses: actions/checkout@v4
        with:
          ref: main
          path: cleanup
          fetch-depth: 2

      - name: Self-clean main
        if: always()
        shell: bash
        run: |
          cd cleanup
          expected_parent='f4fa20a4db31410fdbf63320a1c01ca77e4afa45'
          actual_parent=$(git rev-parse HEAD^)
          if [ "$actual_parent" != "$expected_parent" ]; then
            echo "Unexpected main parent: $actual_parent"
            exit 1
          fi
          rm .github/workflows/phase3-task3-allocation-red.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/phase3-task3-allocation-red.yml
          git commit -m 'chore: remove Phase 3 Task 3 allocation RED runner'
          git push origin HEAD:main
