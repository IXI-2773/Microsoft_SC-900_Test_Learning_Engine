name: Build PR32 exact-head QA artifact

on:
  push:
    branches:
      - fix/sc900-answer-d-confidence-ui-001

permissions:
  contents: read

jobs:
  build-pr32-qa:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QA_SOURCE_SHA: b22970378ff9229f3b7853cc4c1675af652539ee

    steps:
      - name: Checkout exact authorized PR32 source
        uses: actions/checkout@v4
        with:
          ref: b22970378ff9229f3b7853cc4c1675af652539ee
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QA_SOURCE_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -r requirements-extract.txt

      - name: Build and verify QA-only Windows release
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.build_windows_release
          test -f release/SC900TestLearningEngine/SC900TestLearningEngine.exe
          test -f release/SC900TestLearningEngine/release_manifest.json
          printf '%s\n' "$QA_SOURCE_SHA" > release/SC900TestLearningEngine/PR32_QA_SOURCE_SHA.txt
          sha256sum release/SC900TestLearningEngine/SC900TestLearningEngine.exe
          cat release/SC900TestLearningEngine/release_manifest.json
          test "$(git rev-parse HEAD)" = "$QA_SOURCE_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Upload PR32 QA-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: PR32-QA-b22970378ff9229f3b7853cc4c1675af652539ee
          path: release/SC900TestLearningEngine/
          if-no-files-found: error
