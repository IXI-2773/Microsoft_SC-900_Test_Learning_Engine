name: PR32 left-edge clamp TDD and QA

on:
  push:
    branches:
      - fix/sc900-answer-d-confidence-ui-001

permissions:
  contents: write

jobs:
  repair-and-build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PRE_WORKFLOW_HEAD: b59db099f649864e3aa3e26a00fde344bf0d146e
      BRANCH: fix/sc900-answer-d-confidence-ui-001
      BANK_SHA256: 177a4fb5f8a874ffe4dda6b69e3d1c03dbdad1f5db5a174a990eb8b5a0e5927c

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/sc900-answer-d-confidence-ui-001
          fetch-depth: 0

      - name: Verify bounded starting state
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PRE_WORKFLOW_HEAD" HEAD
          test "$(git diff --name-only "$PRE_WORKFLOW_HEAD" HEAD)" = ".github/workflows/pr32-left-edge-clamp-qa.yml"
          test "$(git rev-parse origin/research/sc900-cand01r3-measurement-001)" = "fc7d32f976c0b4c75658ff67d8d47ebe53d854bb"
          test "$(git rev-parse origin/recovery/publish-exact-history/sc900-v8-20260910)" = "b567d4b74a2f99e50022dd0dafd81ffa75dff0a2"
          test "$(git rev-parse origin/recovery/publish-sc900-v8-exact-history)" = "bbc3bd900b73bde89151dc51706ad62fc69e8196"
          test "$(sha256sum sc900_bank_v8_final.json | awk '{print $1}')" = "$BANK_SHA256"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -r requirements-extract.txt

      - name: Add far-left clamp regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_ui_confidence_controls.py')
          text = path.read_text(encoding='utf-8')
          marker = '    def test_d_anchored_confidence_prompt_is_bounded_to_visible_canvas(self):\n'
          lines = [
              '    def test_confidence_prompt_clamps_centered_pointer_at_left_viewport_edge(self):',
              '        app = object.__new__(QuestionFlowMixin)',
              '        app.root = _Root(pointer_x=125, pointer_y=520)',
              '        app.content_frame = _GeometryWidget(x=100, y=100, width=700, height=900)',
              '        app.content_canvas = _CanvasGeometry(',
              '            x=100,',
              '            y=100,',
              '            width=700,',
              '            height=260,',
              '            visible_top=400,',
              '        )',
              '        answer_row = _GeometryWidget(x=120, y=500, width=650, height=50)',
              '        prompt = _GeometryWidget(width=1, height=1, requested_width=240, requested_height=90)',
              '',
              '        x, y = app._position_feedback_popover(prompt, answer_row)',
              '',
              '        self.assertEqual(12, x)',
              '        self.assertGreaterEqual(y, 410)',
              '        self.assertLessEqual(y, 450)',
              '',
          ]
          test = '\n'.join(lines) + '\n'
          if text.count(marker) != 1:
              raise SystemExit('expected D regression marker not found exactly once')
          path.write_text(text.replace(marker, test + marker), encoding='utf-8')
          PY

      - name: RED - prove far-left click falls back to side placement
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m unittest tests.test_ui_confidence_controls.ConfidenceControlRegressionTests.test_confidence_prompt_clamps_centered_pointer_at_left_viewport_edge -v > red.log 2>&1
          status=$?
          set -e
          cat red.log
          test "$status" -ne 0
          grep -q "test_confidence_prompt_clamps_centered_pointer_at_left_viewport_edge" red.log
          grep -q "AssertionError" red.log

      - name: Apply minimal left-edge clamp repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('app_question_flow_mixin.py')
          text = path.read_text(encoding='utf-8')
          old = (
              '                    centered_x = pointer_x - int(pop_w / 2)\n'
              '                    pointer_candidates = [\n'
              '                        (centered_x, pointer_y + 12),\n'
              '                        (centered_x, pointer_y - pop_h - 12),\n'
          )
          new = (
              '                    centered_x = pointer_x - int(pop_w / 2)\n'
              '                    bounded_centered_x = min(max(min_x, centered_x), max_x)\n'
              '                    pointer_candidates = [\n'
              '                        (bounded_centered_x, pointer_y + 12),\n'
              '                        (bounded_centered_x, pointer_y - pop_h - 12),\n'
          )
          if text.count(old) != 1:
              raise SystemExit('expected centered-pointer block not found exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: GREEN - focused confidence regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_ui_confidence_controls -v

      - name: Remove temporary workflow and verify functional scope
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr32-left-edge-clamp-qa.yml
          changed="$(git diff --name-only "$PRE_WORKFLOW_HEAD" | sort)"
          expected="$(printf '%s\n' app_question_flow_mixin.py tests/test_ui_confidence_controls.py | sort)"
          test "$changed" = "$expected"
          test "$(sha256sum sc900_bank_v8_final.json | awk '{print $1}')" = "$BANK_SHA256"

      - name: Commit final bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: clamp centered confidence prompt at viewport edges'
          echo "QA_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Reverify exact committed source
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
          test "$(git diff --name-only "$PRE_WORKFLOW_HEAD" HEAD | sort)" = "$(printf '%s\n' app_question_flow_mixin.py tests/test_ui_confidence_controls.py | sort)"
          python -m unittest tests.test_ui_confidence_controls -v

      - name: Build Windows QA release
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.build_windows_release
          test -f release/SC900TestLearningEngine/SC900TestLearningEngine.exe
          printf '%s\n' "$QA_SOURCE_SHA" > release/SC900TestLearningEngine/PR32_QA_SOURCE_SHA.txt
          sha256sum release/SC900TestLearningEngine/SC900TestLearningEngine.exe | tee qa-exe.sha256

      - name: Push final repair head
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:"$BRANCH"

      - name: Upload QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PR32-QA-left-edge-clamp-${{ env.QA_SOURCE_SHA }}
          path: release/SC900TestLearningEngine/
          if-no-files-found: error
