name: Apply editable session count

on:
  push:
    branches:
      - fix/editable-session-count

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact starting state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "d8f32c2d37eadf6a92c3c5b28939db21759ccaa1"
          test "$(git ls-remote origin refs/heads/research/sc900-cand01r3-measurement-001 | cut -f1)" = "fc7d32f976c0b4c75658ff67d8d47ebe53d854bb"
          test "$(git ls-remote origin refs/heads/implementation/sc900-cand01r3-gate3 | cut -f1)" = "f742dcc085d46f1999eb8782f709730323e9d7f0"
          test "$(git ls-remote origin refs/heads/recovery/publish-exact-history/sc900-v8-20260910 | cut -f1)" = "b567d4b74a2f99e50022dd0dafd81ffa75dff0a2"
          test "$(git ls-remote origin refs/heads/recovery/publish-sc900-v8-exact-history | cut -f1)" = "bbc3bd900b73bde89151dc51706ad62fc69e8196"
      - name: Apply one-line UI change
        shell: python
        run: |
          from pathlib import Path
          path = Path('app.py')
          text = path.read_text(encoding='utf-8')
          old = 'sess, textvariable=self.session_count_var, state="readonly", values=["25", "50", "90", "All visible"]'
          new = 'sess, textvariable=self.session_count_var, state="normal", values=["25", "50", "90", "All visible"]'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: GREEN focused test
        run: python -m unittest tests.test_session_count_control -v
      - name: Full regression suite
        run: python -m unittest discover -s tests -v
      - name: Commit only app change
        shell: bash
        run: |
          set -euo pipefail
          test "$(git status --short | wc -l)" -eq 1
          test "$(git status --short app.py | wc -l)" -eq 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'ui: allow custom session question counts'
          git push origin HEAD:fix/editable-session-count
