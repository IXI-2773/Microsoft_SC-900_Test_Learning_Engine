name: Format CAND-01R3 Black artifact

on:
  push:
    branches:
      - research/sc900-cand01r3-measurement-001
    paths:
      - .github/workflows/format-cand01r3-black-artifact.yml

permissions:
  contents: read

jobs:
  format-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pushed SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact Black version
        run: python -m pip install 'black==25.12.0'

      - name: Format only the two quality-gate files
        run: python -m black cand01r3_runtime.py cand01r3_protocol.py

      - name: Prove formatting is syntax-only and limited to target files
        run: |
          git diff --name-only
          test "$(git diff --name-only | sort)" = $'cand01r3_protocol.py\ncand01r3_runtime.py'
          python -m compileall -q cand01r3_runtime.py cand01r3_protocol.py

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: cand01r3-black-formatted
          path: |
            cand01r3_runtime.py
            cand01r3_protocol.py
          if-no-files-found: error
          retention-days: 1
