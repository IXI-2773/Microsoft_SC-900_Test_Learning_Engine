name: Format CAND-01R3 Black artifact

on:
  push:
    branches:
      - research/sc900-cand01r3-measurement-001
    paths:
      - .github/workflows/format-cand01r3-black-artifact.yml

permissions:
  contents: read

jobs:
  format-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pushed SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact Black version
        run: python -m pip install 'black==25.12.0'

      - name: Preserve original ASTs and format only target files
        run: |
          cp cand01r3_runtime.py /tmp/cand01r3_runtime.py.before
          cp cand01r3_protocol.py /tmp/cand01r3_protocol.py.before
          python -m black cand01r3_runtime.py cand01r3_protocol.py

      - name: Prove formatting is AST-equivalent and limited to target files
        run: |
          test "$(git diff --name-only | sort)" = $'cand01r3_protocol.py\ncand01r3_runtime.py'
          python -m compileall -q cand01r3_runtime.py cand01r3_protocol.py
          python - <<'PY'
          import ast
          from pathlib import Path

          for name in ('cand01r3_runtime.py', 'cand01r3_protocol.py'):
              before = Path('/tmp') / f'{name}.before'
              after = Path(name)
              before_ast = ast.dump(ast.parse(before.read_text(encoding='utf-8')), include_attributes=False)
              after_ast = ast.dump(ast.parse(after.read_text(encoding='utf-8')), include_attributes=False)
              assert before_ast == after_ast, name
              print(f'AST_EQUIVALENT={name}')
          PY

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: cand01r3-black-formatted
          path: |
            cand01r3_runtime.py
            cand01r3_protocol.py
          if-no-files-found: error
          retention-days: 1
