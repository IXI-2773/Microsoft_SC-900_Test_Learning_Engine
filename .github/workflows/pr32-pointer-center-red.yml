name: PR32 pointer-center RED check

on:
  push:
    branches:
      - fix/sc900-answer-d-confidence-ui-001

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require click over center confidence choice
        shell: bash
        run: |
          python - <<'PY'
          from app_question_flow_mixin import QuestionFlowMixin
          from tests.test_ui_confidence_controls import _CanvasGeometry, _GeometryWidget, _Root

          app = object.__new__(QuestionFlowMixin)
          app.root = _Root(pointer_x=360, pointer_y=520)
          app.content_frame = _GeometryWidget(x=100, y=100, width=700, height=900)
          app.content_canvas = _CanvasGeometry(x=100, y=100, width=700, height=260, visible_top=400)
          answer_row = _GeometryWidget(x=120, y=500, width=650, height=50)
          prompt = _GeometryWidget(width=1, height=1, requested_width=240, requested_height=90)

          x, _y = app._position_feedback_popover(prompt, answer_row)
          pointer_x_in_host = app.root.pointer_x - app.content_frame.x
          popup_center_x = x + prompt.requested_width // 2
          print(f'pointer_x_in_host={pointer_x_in_host} popup_center_x={popup_center_x} popup_x={x}')
          assert popup_center_x == pointer_x_in_host, (
              f'confidence popup center {popup_center_x} must align with click {pointer_x_in_host}'
          )
          PY
