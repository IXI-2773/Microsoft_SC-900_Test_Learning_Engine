name: Phase 2 final readiness correction

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase2-final-readiness-correction.yml

permissions:
  contents: write

jobs:
  correct-and-verify:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: implementation/sc900-reviewed-bank-phase2
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install verification tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install black ruff mypy pyinstaller -r requirements-extract.txt

      - name: Apply bounded final readiness corrections
        shell: bash
        run: |
          set -euo pipefail
          python tools/_phase2_manifest_parity_patch.py
          python -m py_compile tools/validate_sc900_phase2.py tools/build_sc900_phase2.py
          python -m tools.build_sc900_phase2 --write > _phase2_receipt_write.json
          rm -f _phase2_receipt_write.json

      - name: Verify focused Phase 2 corrections
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_sc900_phase2_deep_review tests.test_sc900_phase2_receipt_portability tests.test_sc900_phase2 -v
          python -m tools.build_sc900_phase2 --verify-committed

      - name: Verify generated artifact scope before full regression
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          test "$changed" = $'content/sc900/phase2/phase2_build_receipt.json\ntools/build_sc900_phase2.py\ntools/validate_sc900_phase2.py'

      - name: Run full repository regression and quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python tools/lint_bank.py
          python tools/verify_installation.py
          python tools/run_quality_checks.py

      - name: Publish verified Phase 2 correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/_phase2_manifest_parity_patch.py
          git add tools/validate_sc900_phase2.py tools/build_sc900_phase2.py content/sc900/phase2/phase2_build_receipt.json
          staged="$(git diff --cached --name-only | sort)"
          printf '%s\n' "$staged"
          test "$staged" = $'content/sc900/phase2/phase2_build_receipt.json\ntools/_phase2_manifest_parity_patch.py\ntools/build_sc900_phase2.py\ntools/validate_sc900_phase2.py'
          git commit -m 'fix: close Phase 2 readiness assurance gaps'
          git push origin HEAD:implementation/sc900-reviewed-bank-phase2

      - name: Verify published branch artifacts
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin implementation/sc900-reviewed-bank-phase2
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/implementation/sc900-reviewed-bank-phase2)"
          test ! -e tools/_phase2_manifest_parity_patch.py
          python -m unittest tests.test_sc900_phase2_deep_review tests.test_sc900_phase2_receipt_portability tests.test_sc900_phase2 -v
          python -m tools.build_sc900_phase2 --verify-committed
          git diff --exit-code

      - name: Self-remove verification workflow
        if: always()
        shell: bash
        run: |
          git reset --hard
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/phase2-final-readiness-correction.yml
          git commit -m 'chore: remove Phase 2 final readiness runner'
          git push origin HEAD:main
