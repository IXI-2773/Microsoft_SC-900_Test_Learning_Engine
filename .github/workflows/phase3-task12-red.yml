name: Phase 3 Task 1 RED contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase3-task12-red.yml'

permissions:
  contents: write

jobs:
  red-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 3 test commit
        uses: actions/checkout@v4
        with:
          ref: 5e2658d399eff1e4cebb7e90b8aceee3ae3fbb6e
          path: phase3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require expected RED failure
        shell: bash
        run: |
          cd phase3
          set +e
          python -m unittest tests.test_sc900_phase3 -v 2>&1 | tee /tmp/phase3-red.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'ERROR: Phase 3 tests unexpectedly passed before validator implementation.'
            exit 1
          fi
          grep -q 'tools.validate_sc900_phase3 must exist' /tmp/phase3-red.log
          echo 'EXPECTED_RED_CONFIRMED=YES'

      - name: Remove one-shot workflow and restore main tree
        if: always()
        uses: actions/checkout@v4
        with:
          ref: main
          path: cleanup
          fetch-depth: 2

      - name: Self-clean main
        if: always()
        shell: bash
        run: |
          cd cleanup
          expected_parent='a2cc5247706c938efc92b8ef21a453ed909ec738'
          actual_parent=$(git rev-parse HEAD^)
          if [ "$actual_parent" != "$expected_parent" ]; then
            echo "Unexpected main parent: $actual_parent"
            exit 1
          fi
          rm .github/workflows/phase3-task12-red.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/phase3-task12-red.yml
          git commit -m 'chore: remove Phase 3 Task 1 RED runner'
          git push origin HEAD:main
