name: Read-only answer-length leakage audit

on:
  push:
    branches:
      - fix/sc900-answer-d-confidence-ui-001

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit final-bank answer-length leakage
        shell: bash
        run: |
          python - <<'PY'
          import json, re, statistics
          from collections import Counter, defaultdict
          from pathlib import Path

          path = Path('sc900_bank_v8_final.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          if isinstance(data, dict):
              rows = data.get('questions') or data.get('items') or data.get('bank') or []
          else:
              rows = data
          if not isinstance(rows, list):
              raise SystemExit('Unsupported bank shape')

          def correct_letters(q):
              raw = q.get('correct')
              if raw is None:
                  raw = q.get('correct_answers')
              if raw is None:
                  raw = q.get('answer')
              if isinstance(raw, str):
                  vals = re.findall(r'[A-Z]', raw.upper())
              elif isinstance(raw, (list, tuple, set)):
                  vals = [str(x).strip().upper() for x in raw]
              else:
                  vals = []
              return [x for x in vals if x in {'A','B','C','D','E','F'}]

          def chars(s):
              return len(re.sub(r'\s+', ' ', str(s or '').strip()))

          def words(s):
              return len(re.findall(r"\b[\w'-]+\b", str(s or '')))

          records=[]
          skipped=0
          for q in rows:
              choices=q.get('choices') or q.get('options') or {}
              if isinstance(choices, list):
                  choices={chr(65+i):v for i,v in enumerate(choices)}
              if not isinstance(choices, dict):
                  skipped += 1; continue
              choices={str(k).strip().upper():str(v or '') for k,v in choices.items() if str(v or '').strip()}
              correct=correct_letters(q)
              if len(correct)!=1 or correct[0] not in choices or len(choices)<2:
                  skipped += 1; continue
              c=correct[0]
              lens={k:chars(v) for k,v in choices.items()}
              wlens={k:words(v) for k,v in choices.items()}
              distract=[v for k,v in lens.items() if k!=c]
              maxd=max(distract)
              maxall=max(lens.values())
              longest=[k for k,v in lens.items() if v==maxall]
              rec={
                  'id': q.get('id') or q.get('question_id') or q.get('question_number'),
                  'number': q.get('question_number'),
                  'domain': q.get('domain') or q.get('objective_domain') or '',
                  'tier': q.get('tier') or q.get('difficulty_tier') or '',
                  'correct': c,
                  'correct_chars': lens[c],
                  'max_distractor_chars': maxd,
                  'advantage_chars': lens[c]-maxd,
                  'correct_words': wlens[c],
                  'strict_longest': lens[c] > maxd,
                  'among_longest': c in longest,
                  'unique_longest': len(longest)==1,
                  'unique_longest_correct': len(longest)==1 and longest[0]==c,
                  'longest_letters': longest,
              }
              records.append(rec)

          n=len(records)
          if not n: raise SystemExit('No analyzable single-answer questions')
          strict=sum(r['strict_longest'] for r in records)
          among=sum(r['among_longest'] for r in records)
          unique=[r for r in records if r['unique_longest']]
          unique_correct=sum(r['unique_longest_correct'] for r in unique)
          mean_correct=statistics.mean(r['correct_chars'] for r in records)
          mean_maxd=statistics.mean(r['max_distractor_chars'] for r in records)
          pos=sum(r['advantage_chars']>0 for r in records)
          neg=sum(r['advantage_chars']<0 for r in records)
          zero=n-pos-neg

          by_domain=defaultdict(lambda:{'n':0,'strict':0,'unique':0,'unique_correct':0})
          by_tier=defaultdict(lambda:{'n':0,'strict':0,'unique':0,'unique_correct':0})
          for r in records:
              for key,bucket in ((r['domain'] or '(unknown)',by_domain),(r['tier'] or '(unknown)',by_tier)):
                  d=bucket[key]; d['n']+=1; d['strict']+=int(r['strict_longest']); d['unique']+=int(r['unique_longest']); d['unique_correct']+=int(r['unique_longest_correct'])

          outliers=sorted(records,key=lambda r:(r['advantage_chars'],r['correct_chars']),reverse=True)[:25]
          report={
              'bank_file':str(path),
              'bank_question_count':len(rows),
              'single_answer_analyzable':n,
              'skipped_non_single_or_schema':skipped,
              'strict_longest_correct_count':strict,
              'strict_longest_correct_pct':round(100*strict/n,2),
              'correct_among_longest_count':among,
              'correct_among_longest_pct':round(100*among/n,2),
              'unique_longest_questions':len(unique),
              'unique_longest_correct_count':unique_correct,
              'unique_longest_correct_pct_of_unique':round(100*unique_correct/len(unique),2) if unique else None,
              'mean_correct_chars':round(mean_correct,2),
              'mean_max_distractor_chars':round(mean_maxd,2),
              'correct_longer_than_every_distractor':pos,
              'correct_equal_to_max_distractor':zero,
              'correct_shorter_than_some_distractor':neg,
              'by_domain':dict(by_domain),
              'by_tier':dict(by_tier),
              'top_outliers':outliers,
          }
          print('ANSWER_LENGTH_AUDIT_JSON_BEGIN')
          print(json.dumps(report, indent=2, sort_keys=True))
          print('ANSWER_LENGTH_AUDIT_JSON_END')
          PY
