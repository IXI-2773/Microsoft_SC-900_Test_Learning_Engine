name: Phase 3 Task 3 allocation GREEN

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase3-task3-allocation-green.yml'

permissions:
  contents: write

jobs:
  freeze-allocation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out allocation-test head
        uses: actions/checkout@v4
        with:
          ref: c30558d02755f06ac3032ebe70cb7fa9c70ed2c6
          fetch-depth: 0
          path: phase3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate deterministic 100-item allocation
        shell: bash
        run: |
          cd phase3
          python - <<'PY'
          from collections import Counter, defaultdict
          import json
          from pathlib import Path

          objective_specs = {
              'security_compliance_concepts': ('security_compliance_identity', ['shared_responsibility_model','defense_in_depth','zero_trust_model','encryption_and_hashing','grc_concepts'], [2,1,1,1,1]),
              'identity_concepts': ('security_compliance_identity', ['identity_primary_security_perimeter','authentication','authorization','identity_providers','directory_services_active_directory','federation'], [1,1,1,1,1,1]),
              'entra_identity_types_and_function': ('microsoft_entra', ['entra_id_overview','identity_types_including_agent_id','hybrid_identity'], [2,2,2]),
              'entra_authentication': ('microsoft_entra', ['authentication_methods','multifactor_authentication','password_protection_management'], [3,3,2]),
              'entra_access_management': ('microsoft_entra', ['conditional_access','entra_roles_rbac'], [3,3]),
              'entra_identity_protection_governance': ('microsoft_entra', ['entra_id_governance','access_reviews','privileged_identity_management','entra_id_protection'], [2,2,2,2]),
              'azure_infrastructure_security': ('microsoft_security_solutions', ['azure_ddos_protection','azure_firewall','azure_web_application_firewall','azure_virtual_network_segmentation','network_security_groups','azure_bastion','azure_key_vault'], [2,2,2,2,2,1,1]),
              'azure_security_management': ('microsoft_security_solutions', ['microsoft_defender_for_cloud','cloud_security_posture_management','security_policies_standards_recommendations','cloud_workload_protection'], [2,2,2,2]),
              'microsoft_sentinel': ('microsoft_security_solutions', ['siem_and_soar','sentinel_threat_detection_mitigation'], [3,3]),
              'defender_xdr': ('microsoft_security_solutions', ['defender_xdr_services','defender_for_office_365','defender_for_endpoint','defender_for_cloud_apps','defender_for_identity','defender_vulnerability_management','defender_threat_intelligence','defender_portal'], [2,2,2,2,1,1,1,1]),
              'service_trust_privacy': ('microsoft_compliance_solutions', ['service_trust_portal_offerings','microsoft_privacy_principles'], [2,2]),
              'purview_compliance_management': ('microsoft_compliance_solutions', ['purview_portal','compliance_manager','compliance_score'], [2,1,1]),
              'purview_information_protection_lifecycle': ('microsoft_compliance_solutions', ['data_classification','content_and_activity_explorer','sensitivity_labels_and_policies','data_loss_prevention','records_management','retention_policies_labels'], [2,2,1,1,1,1]),
              'purview_insider_risk_ediscovery_audit': ('microsoft_compliance_solutions', ['insider_risk_management','ediscovery','audit'], [2,2,2]),
          }
          source_map = {
              'security_compliance_concepts': ('question-source-70b519f7c155','https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/','learn-security_compliance_concepts'),
              'identity_concepts': ('question-source-a02b6b6ebcad','https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/','learn-identity_concepts'),
              'entra_identity_types_and_function': ('question-source-06ee41b74b64','https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/','learn-entra_identity_types_and_function'),
              'entra_authentication': ('question-source-8fb8d254ebb6','https://learn.microsoft.com/en-us/training/modules/explore-authentication-capabilities/','learn-entra_authentication'),
              'entra_access_management': ('question-source-200ddb3e30db','https://learn.microsoft.com/en-us/training/modules/explore-access-management-capabilities/','learn-entra_access_management'),
              'entra_identity_protection_governance': ('question-source-8f30eec2243f','https://learn.microsoft.com/en-us/training/modules/describe-identity-protection-governance-capabilities/','learn-entra_identity_protection_governance'),
              'azure_infrastructure_security': ('question-source-cab074c9602c','https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/','learn-azure_infrastructure_security'),
              'azure_security_management': ('question-source-ef974ed35b7a','https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/','learn-azure_security_management'),
              'microsoft_sentinel': ('question-source-ba9d0f97474f','https://learn.microsoft.com/en-us/training/modules/describe-security-capabilities-of-azure-sentinel/','learn-microsoft_sentinel'),
              'defender_xdr': ('question-source-b7becc5bddd0','https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/','learn-defender_xdr'),
              'service_trust_privacy': ('question-source-0a78d22b0990','https://learn.microsoft.com/en-us/training/modules/describe-compliance-management-capabilities-microsoft/','learn-service_trust_privacy'),
              'purview_compliance_management': ('question-source-e0a5b475191d','https://learn.microsoft.com/en-us/training/modules/explore-plan-compliance-microsoft-365/','learn-purview_compliance_management'),
              'purview_information_protection_lifecycle': ('question-source-2ed5cc704ae0','https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/','learn-purview_information_protection_lifecycle'),
              'purview_insider_risk_ediscovery_audit': ('question-source-54a1385da82f','https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/','learn-purview_insider_risk_ediscovery_audit'),
          }
          domains = ['security_compliance_identity','microsoft_entra','microsoft_security_solutions','microsoft_compliance_solutions']
          quotas = {}
          for batch in range(1, 11):
              quota = dict(zip(domains, [1,3,4,2]))
              if batch in (1, 2):
                  quota['security_compliance_identity'] = 2
                  quota['microsoft_entra'] = 2
              if batch in (3, 4):
                  quota['microsoft_security_solutions'] = 3
                  quota['microsoft_compliance_solutions'] = 3
              quotas[batch] = quota

          remaining = defaultdict(dict)
          for objective, (domain, leaves, counts) in objective_specs.items():
              slots = []
              for leaf, count in zip(leaves, counts):
                  slots.extend([leaf] * count)
              remaining[domain][objective] = slots

          assignments = defaultdict(list)
          for batch in range(1, 11):
              for domain in domains:
                  used_objective = Counter()
                  used_leaf = Counter()
                  for _ in range(quotas[batch][domain]):
                      candidates = []
                      for objective, slots in remaining[domain].items():
                          if not slots:
                              continue
                          leaf = min(slots, key=lambda value: (used_leaf[value], slots.index(value)))
                          score = (used_objective[objective], used_leaf[leaf], -len(slots), objective, leaf)
                          candidates.append((score, objective, leaf))
                      _, objective, leaf = min(candidates)
                      remaining[domain][objective].remove(leaf)
                      assignments[batch].append((domain, objective, leaf))
                      used_objective[objective] += 1
                      used_leaf[leaf] += 1

          items = []
          positions = ['A','B','C','D']
          serial = 1
          for batch in range(1, 11):
              for domain, objective, leaf in assignments[batch]:
                  source_id, source_url, source_family = source_map[objective]
                  items.append({
                      'question_id': f'sc900_p3_q{serial:03d}',
                      'batch': f'batch-{batch:02d}',
                      'domain': domain,
                      'objective': objective,
                      'blueprint_leaf_id': leaf,
                      'source_inventory_id': source_id,
                      'source_url': source_url,
                      'source_family_id': source_family,
                      'display_correct_position_target': positions[(serial - 1) % 4],
                  })
                  serial += 1

          payload = {
              'schema_version': 'sc900.phase3-authoring-allocation/v1',
              'work_id': 'SC900-BANK-PHASE3-001',
              'task': 'TASK_3_AUTHORING_REVIEW',
              'frozen_at': '2026-09-11',
              'skills_effective_date': '2026-07-28',
              'question_count': 100,
              'batch_count': 10,
              'items': items,
          }
          path = Path('content/sc900/phase3/authoring_allocation.json')
          path.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Run allocation contract GREEN
        shell: bash
        run: |
          cd phase3
          python -m unittest tests.test_sc900_phase3_authoring_allocation -v
          git diff --exit-code -- tests/test_sc900_phase3_authoring_allocation.py
          test "$(git status --short | wc -l)" -eq 1
          git status --short | grep '^?? content/sc900/phase3/authoring_allocation.json$'

      - name: Commit only frozen allocation to Phase 3 branch
        shell: bash
        run: |
          cd phase3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/sc900/phase3/authoring_allocation.json
          git diff --cached --name-only | grep -x 'content/sc900/phase3/authoring_allocation.json'
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'content: freeze SC-900 Phase 3 authoring allocation'
          git push origin HEAD:implementation/sc900-reviewed-bank-phase3

      - name: Remove one-shot workflow
        if: always()
        uses: actions/checkout@v4
        with:
          ref: main
          path: cleanup
          fetch-depth: 2

      - name: Self-clean main
        if: always()
        shell: bash
        run: |
          cd cleanup
          expected_parent='c5d50236d2dc254320a551cf08647485f4de5b77'
          actual_parent=$(git rev-parse HEAD^)
          if [ "$actual_parent" != "$expected_parent" ]; then
            echo "Unexpected main parent: $actual_parent"
            exit 1
          fi
          rm .github/workflows/phase3-task3-allocation-green.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/phase3-task3-allocation-green.yml
          git commit -m 'chore: remove Phase 3 Task 3 allocation GREEN runner'
          git push origin HEAD:main
