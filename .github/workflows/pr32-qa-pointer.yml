name: Build PR32 pointer QA artifact

on:
  push:
    branches:
      - fix/sc900-answer-d-confidence-ui-001

permissions:
  contents: read

jobs:
  build-pr32-pointer-qa:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QA_SOURCE_SHA: 4fc948a178a2df132a0a1ebbbaf0a63000c891be

    steps:
      - name: Checkout exact QA source
        uses: actions/checkout@v4
        with:
          ref: 4fc948a178a2df132a0a1ebbbaf0a63000c891be
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QA_SOURCE_SHA"
          test -z "$(git status --porcelain=v1)"
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -r requirements-extract.txt
      - name: Run focused UI regression
        shell: bash
        run: python -m unittest tests.test_ui_confidence_controls -v
      - name: Build Windows QA release
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.build_windows_release
          test -f release/SC900TestLearningEngine/SC900TestLearningEngine.exe
          printf '%s\n' "$QA_SOURCE_SHA" > release/SC900TestLearningEngine/PR32_QA_SOURCE_SHA.txt
          sha256sum release/SC900TestLearningEngine/SC900TestLearningEngine.exe
      - name: Upload QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PR32-QA-pointer-4fc948a178a2df132a0a1ebbbaf0a63000c891be
          path: release/SC900TestLearningEngine/
          if-no-files-found: error
