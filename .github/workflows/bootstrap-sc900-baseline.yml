name: Bootstrap SC-900 v8 baseline

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.head_ref == 'implementation/sc900-v8-baseline'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: implementation/sc900-v8-baseline
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git identity
        shell: bash
        run: |
          git config user.name "SC-900 Baseline Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install verification tools
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install black ruff mypy pyinstaller

      - name: Execute staged TDD migration and release gate
        shell: bash
        env:
          CI: 'true'
        run: python .github/scripts/bootstrap_sc900_v8_current.py

      - name: Upload verified Windows release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SC900TestLearningEngine-v8-baseline
          path: release/SC900TestLearningEngine/
          if-no-files-found: error
